[workspace]
members = ["crates/*"]

[package]
name = "vision_app"
version = "0.1.0"
edition = "2024"

[profile.dev]
split-debuginfo = "packed"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
eframe = "0.33.3"
eyre = "0.6.12"
# opencv = "0.98.0"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ort = {version = "2.0.0-rc.11", features = ["cuda", "migraphx", "tensorrt", "directml", "tracing"]}
#ort = {branch = "valentinus", git = "https://github.com/kn0sys/ort.git", features = ["cuda", "migraphx", "tensorrt", "tracing", "load-dynamic"]}
#ort = {path="/home/quant/extproj/ort", features = ["cuda", "migraphx", "tensorrt", "tracing", "load-dynamic"]}
# ort = {version = "2.0.0-rc.10", features = ["rocm"]}
ndarray = "0.17.1"
image = "0.25.9"
glam = "0.30.9"
ordered-float = "5.1.0"
rfd = "0.17.1"

node_plumbing = { path = "crates/node_plumbing" }
argh = "0.1.14"

[target.'cfg(unix)'.dependencies]
ort = {version = "2.0.0-rc.11", features = ["load-dynamic"]}
